<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}视频智能系统{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="app-header">
        <div style="display:flex;align-items:center;justify-content:space-between;">
            <div>
                <h1>🎬 视频智能系统</h1>
                <div class="subtitle">{% block subtitle %}{% endblock %}</div>
            </div>
            <nav class="top-nav">
                <a href="/learn" class="nav-item {% block nav_learn %}{% endblock %}">🧠 学习中心</a>
                <a href="/clip" class="nav-item {% block nav_clip %}{% endblock %}">✂️ 智能剪辑</a>
            </nav>
        </div>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="/static/js/common.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
